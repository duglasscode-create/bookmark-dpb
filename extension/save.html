<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardar en Bookmark DPB</title>
  <script src="theme.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ====== TEMA OSCURO (por defecto) ====== */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --border-hover: #475569;
      --text: #e2e8f0;
      --text-strong: #ffffff;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --text-faint: #475569;
      --hover: #263449;
    }

    /* ====== TEMA CLARO ====== */
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #334155;
      --text-strong: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #64748b;
      --text-faint: #94a3b8;
      --hover: #f1f5f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-strong);
      flex: 1;
    }

    .settings-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background-color 0.15s;
      opacity: 0.6;
    }

    .settings-btn:hover {
      background-color: var(--hover);
      opacity: 1;
    }

    /* Info del marcador */
    .bookmark-info {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .bookmark-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-strong);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bookmark-url {
      font-size: 12px;
      color: var(--text-subtle);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* Secciones */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    /* Colecciones */
    .collections-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .collection-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
    }

    .collection-item:hover {
      background-color: var(--hover);
      border-color: var(--border-hover);
    }

    .collection-item.selected {
      background-color: rgba(37, 99, 235, 0.15);
      border-color: #2563eb;
    }

    .collection-icon {
      font-size: 16px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
    }

    .collection-name {
      flex: 1;
      color: var(--text);
    }

    .collection-check {
      color: #2563eb;
      font-weight: bold;
      opacity: 0;
    }

    .collection-item.selected .collection-check {
      opacity: 1;
    }

    /* Etiquetas */
    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-item {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text-muted);
    }

    .tag-item:hover {
      border-color: var(--border-hover);
    }

    .tag-item.selected {
      background-color: rgba(37, 99, 235, 0.2);
      border-color: #2563eb;
      color: #93c5fd;
    }

    /* Botones */
    .actions {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      background-color: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel:hover {
      background-color: var(--card);
      color: var(--text);
    }

    .btn-save {
      flex: 2;
      padding: 12px;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-save:hover {
      background-color: #1d4ed8;
    }

    .btn-save:disabled {
      background-color: var(--border-hover);
      cursor: not-allowed;
    }

    /* Estados */
    .status-message {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .status-message.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-message.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-subtle);
      font-size: 13px;
    }

    .empty-message {
      text-align: center;
      padding: 12px;
      color: var(--text-subtle);
      font-size: 13px;
      background-color: var(--card);
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .shortcut-hint {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-faint);
    }

    .shortcut-hint kbd {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 10px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <span class="header-icon">🔖</span>
      <h1>Guardar en Bookmark DPB</h1>
      <button class="settings-btn" id="settingsBtn" title="Configuración">⚙️</button>
    </div>

    <!-- Info del marcador -->
    <div class="bookmark-info">
      <div class="bookmark-title" id="bookmarkTitle">Cargando...</div>
      <div class="bookmark-url" id="bookmarkUrl"></div>
    </div>

    <!-- Colecciones -->
    <div class="section-label">📁 Colección</div>
    <div class="collections-list" id="collectionsList">
      <div class="loading">Cargando colecciones...</div>
    </div>

    <!-- Etiquetas -->
    <div class="section-label">🏷️ Etiquetas</div>
    <div class="tags-list" id="tagsList">
      <div class="loading">Cargando etiquetas...</div>
    </div>

    <!-- Mensaje de estado -->
    <div class="status-message" id="statusMessage"></div>

    <!-- Botones -->
    <div class="actions">
      <button class="btn-cancel" id="cancelBtn">Cancelar</button>
      <button class="btn-save" id="saveBtn">💾 Guardar</button>
    </div>

    <!-- Pista de atajo de teclado -->
    <div class="shortcut-hint">
      <kbd>Enter</kbd> para guardar · <kbd>Esc</kbd> para cancelar
    </div>
  </div>

  <script src="save.js"></script>
</body>
</html>
